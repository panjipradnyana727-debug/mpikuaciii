                quiz: [
                    { q: "Apa fokus utama dari filsafat Nyaya?", opts: ["Ritual keagamaan", "Logika dan penalaran", "Meditasi", "Penciptaan alam"], ans: 1, feedback: "Nyaya sangat menekankan logika untuk mencapai pengetahuan yang benar." },
                    { q: "Siapa tokoh utama pendiri sistem Nyaya?", opts: ["Rsi Kanada", "Rsi Patanjali", "Rsi Gautama", "Rsi Jaimini"], ans: 2, feedback: "Rsi Gautama (Aksapada) adalah pendiri Nyaya." },
                    { q: "Menurut Nyaya, bagaimana cara terbaik menghadapi berita viral yang belum jelas kebenarannya?", opts: ["Langsung share", "Percaya jika banyak yang share", "Abaikan saja", "Periksa sumber dan bukti logika"], ans: 3, feedback: "Nyaya mengajarkan kita untuk menganalisis dan membuktikan informasi." },
                    { q: "Kata kunci yang paling mewakili Nyaya adalah...", opts: ["Pengendalian diri", "Kategori realitas", "Validitas pengetahuan", "Kewajiban moral"], ans: 2, feedback: "Validitas pengetahuan (Pramana) adalah inti Nyaya." }
                ]
            },
            vaiseshika: {

                sage: 'Rsi Kanada',
                desc: 'Vaiseshika memberikan perhatian terhadap hakikat realitas dan berbagai kategori yang terdapat di dalamnya. Pemikiran ini membantu kita memahami bahwa alam semesta dapat dikaji, diklasifikasikan, dan dipahami secara sistematis (seperti sains purba).',
                application: 'Digunakan saat mengelompokkan fenomena, melakukan penelitian sistematis, dan memahami unsur pembentuk benda.',
                quiz: [
                    { q: "Vaiseshika sangat erat kaitannya dengan...", opts: ["Kategorisasi realitas", "Pengendalian nafas", "Pembebasan jiwa", "Nyanyian suci"], ans: 0, feedback: "Vaiseshika membagi realitas ke dalam kategori (Padartha)." },
                    { q: "Konsep dasar fisika modern mengenai partikel terkecil sejalan dengan ajaran siapa dalam Sad Darsana?", opts: ["Rsi Kapila", "Rsi Kanada (Vaiseshika)", "Rsi Badarayana", "Rsi Gautama"], ans: 1, feedback: "Rsi Kanada mencetuskan konsep 'Anu' atau atom sebagai partikel tak terbagi." },
                    { q: "Apa manfaat praktis belajar Vaiseshika bagi siswa?", opts: ["Pandai menyanyi", "Mampu menganalisis dan mengklasifikasi masalah secara sistematis", "Bisa terbang", "Tidur lebih nyenyak"], ans: 1, feedback: "Vaiseshika melatih pola pikir yang terstruktur dan sistematis." },
                    { q: "Vaiseshika memandang bahwa dunia ini nyata dan dapat dianalisis secara...", opts: ["Emosional", "Magis", "Objektif dan sistematis", "Subjektif"], ans: 2, feedback: "Pendekatan Vaiseshika sangat analitis dan objektif." }

                desc: 'Samkhya bersifat dualistik, mengajarkan dua realitas mutlak: Purusa (kesadaran murni/roh) dan Prakrti (materi/alam). Samkhya mengajarkan pemahaman perbedaan keduanya sebagai jalan menuju pembebasan (mengurangi keterikatan pada hal materi).',
                application: 'Menyadari bahwa tubuh dan pikiran yang berubah-ubah adalah materi (Prakrti), sedangkan inti diri kita (Purusa) adalah kesadaran pengamat.',
                quiz: [
                    { q: "Dua konsep utama dalam Samkhya Darsana adalah...", opts: ["Brahman & Atman", "Purusa & Prakrti", "Yin & Yang", "Dharma & Karma"], ans: 1, feedback: "Samkhya didasarkan pada dualisme Purusa (kesadaran) dan Prakrti (materi)." },
                    { q: "Menurut Samkhya, apa penyebab utama penderitaan manusia?", opts: ["Kurang harta", "Ketidakmampuan membedakan Purusa dan Prakrti", "Banyak musuh", "Nasib buruk"], ans: 1, feedback: "Identifikasi diri yang salah dengan materi (Prakrti) menyebabkan penderitaan." },
                    { q: "Dalam diri manusia, emosi dan pikiran yang terus berubah termasuk ke dalam aspek...", opts: ["Purusa", "Prakrti", "Brahman", "Moksa"], ans: 1, feedback: "Segala yang berubah adalah Prakrti. Purusa adalah kesadaran murni yang statis." },
                    { q: "Siapakah Rsi penyusun ajaran Samkhya?", opts: ["Rsi Kanada", "Rsi Jaimini", "Rsi Kapila", "Rsi Patanjali"], ans: 2, feedback: "Rsi Kapila adalah tokoh utama Samkhya." }
                ]
            },
            yoga: {
                id: 'yoga', title: 'Yoga', subtitle: '"Master the mind."', icon: 'fa-person-praying', color: 'bg-indigo-900',

                desc: 'Yoga menekankan disiplin praktis dan pengendalian diri (fisik dan mental) untuk mencapai keadaan spiritual yang lebih tinggi. Yoga merupakan penerapan praktis dari teori Samkhya.',

                quiz: [
                    { q: "Tujuan utama Yoga menurut Rsi Patanjali adalah...", opts: ["Kesehatan fisik saja", "Penghentian fluktuasi pikiran (Citta Vrtti Nirodha)", "Kekuatan magis", "Kekayaan materi"], ans: 1, feedback: "Inti Yoga adalah mengendalikan gelombang pikiran agar kesadaran murni terpancar." },
                    { q: "Yoga sering dianggap sebagai pasangan praktis dari filsafat teori...", opts: ["Nyaya", "Vedanta", "Mimamsa", "Samkhya"], ans: 3, feedback: "Samkhya memberikan teori (Purusa-Prakrti), Yoga memberikan metode praktisnya." },

            },
            mimamsa: {

                desc: 'Mimamsa fokus pada analisis kritis teks-teks Weda, khususnya mengenai kewajiban (Dharma) dan pelaksanaan tindakan ritual/keagamaan. Mengajarkan pentingnya menjalankan kewajiban dengan landasan yang benar.',
                application: 'Melaksanakan kewajiban sebagai pelajar, menghormati orang tua, dan mengerjakan tugas dengan tanggung jawab.',
                quiz: [
                    { q: "Mimamsa (Purva Mimamsa) sangat menekankan pada konsep...", opts: ["Meditasi diam", "Dharma (Kewajiban) dan ritual", "Penelitian atom", "Penyatuan Atman"], ans: 1, feedback: "Mimamsa berfokus pada tindakan yang benar (Karma Kanda) sesuai Weda." },

                    { q: "Menurut Vedanta (khususnya Advaita), apa hakikat diri manusia yang sebenarnya?", opts: ["Tubuh fisik", "Pikiran dan emosi", "Atman yang suci dan kekal", "Kekayaan yang dimiliki"], ans: 2, feedback: "Diri sejati bukan raga/pikiran, melainkan Atman." },
                    { q: "Ketika kamu menyadari bahwa di balik semua perbedaan warna kulit dan suku terdapat jiwa yang sama, kamu menerapkan pandangan...", opts: ["Mimamsa", "Nyaya", "Vaiseshika", "Vedanta"], ans: 3, feedback: "Vedanta mengajarkan kesatuan esensial (Brahman) di balik keragaman wujud." }

        const finalQuestData = [
            { id: 1, path: 'nyaya', q: "Kasus: Sebuah broadcast WA mengatakan 'Makan buah X menyembuhkan segala penyakit' tanpa link jurnal medis. Berdasarkan Nyaya, langkah pertama yang benar adalah...", opts: ["Bagikan ke grup keluarga agar semua sehat", "Gunakan Pratyaksha (pengamatan) dan Anumana (inferensi logika) untuk mengecek sumber klaim tersebut", "Abaikan karena semua broadcast pasti bohong", "Marahi pengirim pesan"], ans: 1 },
            { id: 2, path: 'vaiseshika', q: "Jika kita ingin meneliti struktur zat buah X tersebut di laboratorium, memilah unsurnya menjadi kategori, kita menggunakan pola pikir...", opts: ["Nyaya", "Vaiseshika", "Yoga", "Mimamsa"], ans: 1 },
            { id: 3, path: 'samkhya', q: "Kasus: Setelah membaca komentar negatif di medsos, kamu merasa sangat sedih. Menurut Samkhya, kesedihan ini terjadi karena...", opts: ["Orang lain memang jahat", "Kamu mengidentifikasikan dirimu (Purusa) dengan fluktuasi pikiran/emosi (Prakrti)", "Kamu kurang ibadah", "Karma masa lalu"], ans: 1 },
            { id: 4, path: 'yoga', q: "Untuk mengatasi emosi negatif tersebut, tindakan mengendalikan nafas (Pranayama) dan menarik indria dari objek luar (Pratyahara) diajarkan oleh Darsana...", opts: ["Yoga", "Mimamsa", "Nyaya", "Vaiseshika"], ans: 0 },
            { id: 5, path: 'mimamsa', q: "Kasus: Besok ada ujian penting, tapi malam ini ada episode terakhir serial favoritmu. Mengutamakan belajar karena menyadari statusmu sebagai pelajar adalah pengamalan dari...", opts: ["Vedanta (Mencari Tuhan)", "Mimamsa (Menjalankan Dharma/Kewajiban)", "Samkhya (Menghindari Prakrti)", "Vaiseshika (Menganalisis film)"], ans: 1 },
            { id: 6, path: 'vedanta', q: "Saat merenungkan bahwa kegagalan ujian bukanlah akhir dari segalanya, karena inti sejatimu (Atman) tidak tersentuh oleh nilai rapor, kamu sedang mempraktikkan filosofi...", opts: ["Vedanta", "Nyaya", "Yoga", "Mimamsa"], ans: 0 },

            { id: 8, type: 'general', q: "Aliran manakah yang terkenal dengan teori atomismenya (Anu)?", opts: ["Samkhya", "Yoga", "Vaiseshika", "Mimamsa"], ans: 2 },
            { id: 9, type: 'general', q: "Manakah pasangan filsafat yang sering disebut sebagai sistem yang saling melengkapi (teori dan praktik)?", opts: ["Nyaya & Vaiseshika", "Samkhya & Yoga", "Mimamsa & Vedanta", "Semua benar"], ans: 3 }, // Actually all are pairs, but let's make the answer "Semua benar" to be pedagogical, or specifically Samkhya-Yoga. Let's stick to Samkhya & Yoga as the most famous practical pair. Wait, standard pairing is Nyaya-Vaiseshika, Samkhya-Yoga, Mimamsa-Vedanta. So "Semua benar" is academically accurate.
            { id: 10, type: 'general', q: "Mempelajari Darsana bertujuan untuk...", opts: ["Menjadi sakti mandraguna", "Menghafal nama-nama dewa", "Meningkatkan kemampuan berpikir kritis, memahami realitas, dan mencapai tujuan spiritual", "Hanya lulus ujian agama Hindu"], ans: 2 }
        ];

        // --- COMPONENTS ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled=false }) => {
            const baseStyle = "px-6 py-3 rounded-xl font-bold transition-all duration-300 shadow-lg flex items-center justify-center gap-2 transform active:scale-95";
            const variants = {
                primary: "bg-hindu-maroon text-parchment hover:bg-red-900 border border-red-700 disabled:opacity-50",
                secondary: "bg-hindu-gold text-hindu-brown hover:bg-yellow-500 disabled:opacity-50",
                outline: "bg-transparent border-2 border-hindu-maroon text-hindu-maroon hover:bg-hindu-maroon hover:text-parchment dark:border-hindu-gold dark:text-hindu-gold dark:hover:bg-hindu-gold dark:hover:text-hindu-brown",
                game: "bg-gradient-to-r from-hindu-green to-teal-800 text-white hover:from-teal-800 hover:to-hindu-green border-2 border-teal-300"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const Card = ({ children, className = '' }) => (
            <div className={`glass-card p-6 md:p-8 rounded-2xl ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ title, icon, earned, color }) => (

                <span className="text-xs font-bold text-center w-full truncate">{title}</span>
            </div>
        );

            <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 mb-2 overflow-hidden border border-gray-300 dark:border-gray-600">
                <div className={`${colorClass} h-3 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${percent}%` }}></div>
            </div>
        );

        const Toast = ({ message, type, show }) => {
            if (!show) return null;
            const bg = type === 'success' ? 'bg-green-600' : type === 'xp' ? 'bg-hindu-gold text-hindu-brown' : 'bg-hindu-maroon';
            return (
                <div className={`fixed top-20 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full text-white font-bold shadow-xl flex items-center gap-2 animate-bounce ${bg}`}>
                    <i className={`fa-solid ${type === 'xp' ? 'fa-star' : type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}`}></i>
                    {message}
                </div>
            );
        };

            const [menuOpen, setMenuOpen] = useState(false);
            const navItems = [
                { id: 'HOME', label: 'Beranda' },
                { id: 'INSTRUCTIONS', label: 'Petunjuk' },
                { id: 'OBJECTIVES', label: 'Tujuan' },
                { id: 'MAP', label: 'Peta Sad Darsana' },
                { id: 'RESULTS', label: 'Hasil' },

                <nav className="sticky top-0 z-40 glass-card rounded-none border-t-0 border-l-0 border-r-0 border-b border-hindu-gold/30">

                        <div className="flex justify-between h-16">
                            <div className="flex items-center gap-4">
                                <span className="font-serif font-bold text-2xl tracking-wider text-hindu-maroon dark:text-hindu-gold cursor-pointer" onClick={() => setView('HOME')}>
                                    KUACI
                                </span>
                                <div className="hidden md:flex space-x-1 ml-6">
                                    {navItems.map(item => (
                                        <button key={item.id} onClick={() => setView(item.id)} className="px-3 py-2 rounded-md text-sm font-medium hover:bg-black/5 dark:hover:bg-white/10 transition">
                                            {item.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex items-center bg-hindu-gold text-hindu-brown px-3 py-1 rounded-full font-bold shadow-sm shadow-yellow-500/50">
                                    <i className="fa-solid fa-brain mr-2"></i> XP {xp}
                                </div>
                                <button onClick={toggleDarkMode} className="text-xl p-2 hover:bg-black/5 rounded-full w-10 h-10 flex items-center justify-center">
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon text-indigo-900'}`}></i>
                                </button>
                                <button className="md:hidden text-2xl" onClick={() => setMenuOpen(!menuOpen)}>
                                    <i className="fa-solid fa-bars"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {menuOpen && (
                        <div className="md:hidden glass-card absolute w-full border-b border-hindu-gold/30">
                            <div className="px-2 pt-2 pb-3 space-y-1">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => { setView(item.id); setMenuOpen(false); }} className="block w-full text-left px-3 py-2 rounded-md text-base font-medium hover:bg-black/5">

                                }} />
                            ) : (
                                <div className="mt-6 p-4 bg-green-100 text-green-800 text-center font-bold rounded">
                                    Kamu telah memahami bahwa Sad Darsana adalah kelompok ASTIKA.
                                </div>
                            )}
                        </InfoPage>
                    );
                    case 'MAP': return <MapView progress={totalProgress} setView={setView} state={state} />;
                    
                    case 'FINAL_QUEST': 
                        if (state.finalQuestScore !== null) {
                            return (
                                <div className="flex-grow flex items-center justify-center">
                                    <Card className="text-center">
                                        <h2 className="text-2xl font-bold mb-4">Final Quest Telah Diselesaikan</h2>
                                        <p>Skor kamu: {state.finalQuestScore} / {finalQuestData.length}</p>
                                        <Button onClick={() => setView('RESULTS')} className="mt-4">Lihat Hasil Akhir</Button>
                                    </Card>
                                </div>
                            );
                        }
                        return (
                        <div className="max-w-4xl mx-auto p-4 md:p-6 my-4 w-full animate-fade-in">
                            <Card className="border-t-8 border-hindu-maroon">
                                <div className="text-center mb-8">
                                    <h1 className="text-4xl font-serif font-bold text-hindu-maroon dark:text-hindu-gold">⚔️ THE SIX PERSPECTIVES</h1>
                                    <p className="mt-2 italic">Ujian Pemahaman Komprehensif</p>
                                </div>
                                <div className="bg-gray-100 dark:bg-gray-800 p-6 rounded-xl mb-8 font-serif leading-relaxed text-lg shadow-inner">
                                    <strong>STUDI KASUS:</strong><br/>
                                    <p className="mt-2">Seorang siswa mendapatkan informasi viral mengenai kesehatan dari grup chat dan langsung mempercayainya tanpa memeriksa sumber. Setelah ia membagikannya ke medsos, ia mendapat banyak komentar negatif. Ia menjadi emosional, kehilangan konsentrasi belajar, dan akhirnya mengabaikan tugas sekolah esok harinya. Di sela kekacauan itu, ia merenung mempertanyakan apa sebenarnya tujuan tindakannya.</p>
                                </div>
                                <QuizEngine isFinal={true} questions={finalQuestData} onComplete={(score) => {
                                    updateState({ finalQuestScore: score, xp: state.xp + (score * 50) });
                                    triggerToast(`Final Quest Selesai! +${score*50} XP`, 'success');
                                    setTimeout(() => setView('RESULTS'), 1500);
                                }} />
                            </Card>
                        </div>
                    );
                    
                    case 'RESULTS': return <ResultsView state={state} setView={setView} />;
                    case 'REFLECTION': return <ReflectionView state={state} updateState={updateState} setView={setView} triggerToast={triggerToast} />;
                    case 'SUMMARY': return <SummaryView />;
                    
                    default: return <HomeView setView={setView} />;
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <Toast {...toast} />
                    <Navbar setView={setView} xp={state.xp} darkMode={darkMode} toggleDarkMode={() => setDarkMode(!darkMode)} />
                    
                    <main className="flex-grow flex flex-col items-center">
                        {renderView()}
                    </main>

                    <footer className="mt-auto py-6 border-t border-gray-200 dark:border-gray-800 text-center text-sm text-gray-500 glass-card rounded-none">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
                            <p>© 2026 KUACI - MPI Sad Darsana. Dibuat untuk Tujuan Pendidikan.</p>
                            <div className="flex gap-4">
                                <button onClick={() => alert("Sumber Referensi Utama:\n1. Titib, I Made. (1996). Veda Sabda Suci Pedoman Praktis Kehidupan.\n2. Donder, I Wayan. (2007). Kosmologi Hindu.\n3. Radhakrishnan, S. (1989). Indian Philosophy.")} className="hover:text-hindu-gold underline">📚 Daftar Sumber</button>
                                <button onClick={handleReset} className="hover:text-red-500 underline">🔄 Reset Progress</button>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
